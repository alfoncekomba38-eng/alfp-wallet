<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALFP Wallet PRO</title>

    <link rel="stylesheet" href="style.css">

    <!-- Ethers v6 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.1/dist/ethers.umd.min.js"></script>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <h1>🔷 ALFP WALLET PRO</h1>
        <button onclick="connectWallet()" class="connectBtn">
            Connect MetaMask
        </button>
        <p id="wallet">Wallet: Not connected</p>
    </header>

    <hr>

    <!-- BALANCES -->
    <section class="card">
        <h2>💰 BALANCES</h2>

        <p id="balance">ALFP: 0</p>
        <p id="nftBalance">NFT: 0</p>
    </section>

    <hr>

    <!-- STAKE -->
    <section class="card">
        <h2>📊 STAKE ALFP</h2>

        <input id="amount" placeholder="Enter ALFP amount">

        <select id="plan">
            <option value="0">30 Days (8%)</option>
            <option value="1">90 Days (12%)</option>
            <option value="2">180 Days (18%)</option>
            <option value="3">365 Days (25%)</option>
        </select>
        <p id="apy">🔥 APY: --</p>
        <div class="buttons">
            <button onclick="stake()" class="stakeBtn">STAKE</button>
        </div>
    </section>

    <hr>

    <!-- WITHDRAW -->
    <section class="card">
        <h2>💸 WITHDRAW</h2>

        <input id="stakeIndex" placeholder="Stake Index (0,1,2...)">

        <div class="buttons">
            <button onclick="withdraw()" class="withdrawBtn">WITHDRAW</button>
        </div>
    </section>

    <hr>

    <!-- REWARDS -->
    <section class="card">
        <h2>📈 REWARDS</h2>

        <p id="reward">Reward: 0 ALFP</p>

        <button onclick="checkReward()">CHECK REWARD</button>
    </section>

    <hr>

    <!-- NFT -->
    <section class="card">
        <h2>🧠 NFT SYSTEM</h2>

        <input id="uri" placeholder="NFT URI (IPFS link)">
        <button onclick="mintNFT()">MINT NFT</button>

        <br><br>

        <input id="buyId" placeholder="NFT ID">
        <button onclick="buyNFT()">BUY NFT</button>
    </section>

    <hr>

<!-- ALFP PAY -->
<section class="card">
    <h2>🛒 ALFP PAY</h2>

    <input
        id="invoiceId"
        placeholder="Invoice ID">

    <input
        id="merchant"
        placeholder="Merchant Wallet Address">

    <input
        id="payAmount"
        placeholder="ALFP Amount">

    <div class="buttons">
        <button onclick="payMerchant()">
            PAY NOW
        </button>
    </div>
</section>

    <!-- FOOTER -->
    <footer>
        <p>© ALFP DeFi Wallet v2</p>
        <p>Contract: 0xbED7...358E3</p>
    </footer>

</div>

<script src="app.js"></script>

</body>
</html>
