<!DOCTYPE html>
<html>
<head>
    <title>ALFP Wallet</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.1/dist/ethers.umd.min.js"></script>
</head>

<body>

<h1>ALFP WALLET</h1>

<button onclick="connectWallet()">Connect MetaMask</button>

<p id="wallet">Wallet: Not connected</p>
<p id="balance">ALFP: 0</p>
<p id="nftBalance">NFT: 0</p>

<hr>

<h2>STAKE ALFP</h2>

<input id="amount" placeholder="Amount">

<select id="plan">
    <option value="0">30 days</option>
    <option value="1">90 days</option>
    <option value="2">180 days</option>
    <option value="3">365 days</option>
</select>

<button onclick="stake()">Stake</button>

<br><br>

<input id="stakeIndex" placeholder="Stake Index">
<button onclick="withdraw()">Withdraw</button>

<p id="reward">Reward: 0</p>
<button onclick="checkReward()">Check Reward</button>

<hr>

<h2>NFT</h2>

<input id="uri" placeholder="NFT URI">
<button onclick="mintNFT()">Mint NFT</button>

<input id="buyId" placeholder="NFT ID">
<button onclick="buyNFT()">Buy NFT</button>

<script src="app.js"></script>

</body>
</html>
