<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ALFP Wallet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>ALFP WALLET</h1>

    <button id="connectBtn">Connect MetaMask</button>

    <div class="card">
      <p>Wallet: <span id="wallet">Not connected</span></p>
      <p>ALFP Balance: <span id="balance">0</span></p>
    </div>

    <div class="card">
      <h3>Stake ALFP</h3>
      <input id="stakeAmount" placeholder="Amount" />
      <button onclick="stake()">Stake</button>
    </div>

    <div class="card">
      <h3>Rewards</h3>
      <p id="rewards">0</p>
      <button onclick="claim()">Claim Rewards</button>
    </div>

    <div class="card">
      <h3>NFT Actions</h3>
      <button onclick="mintNFT()">Mint NFT</button>
      <button onclick="buyNFT()">Buy NFT</button>
      <button onclick="stakeNFT()">Stake NFT</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
